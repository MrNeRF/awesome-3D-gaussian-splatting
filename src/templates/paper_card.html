<div class="paper-row" data-id="$id" data-title="$title" data-authors="$authors" data-year="$year" data-tags='$tags_json'>
  <div class="paper-card">
    <input type="checkbox" class="selection-checkbox" onclick="handleCheckboxClick(event, '$id', this)">
    <div class="paper-number"></div>
    <div class="paper-thumbnail">
      <img src="$thumbnail" alt="Paper thumbnail for $title" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'"/>
    </div>
    <div class="paper-content">
      <h2 class="paper-title">$title <span class="paper-year">($year)</span></h2>
      <p class="paper-authors">$authors</p>
      <div class="paper-tags">$tags_html</div>
      <div class="paper-links">$links_html</div>
    </div>
  </div>
</div>
