name: Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements-ci.txt

    - name: Install dependencies
      run: pip install -r requirements-ci.txt

    - name: Sweep every URL in the database
      id: sweep
      run: python src/check_links.py

    - name: Open or update the report issue
      uses: actions/github-script@v8
      env:
        HAS_ISSUES: ${{ steps.sweep.outputs.has_issues }}
      with:
        script: |
          const fs = require('fs');
          const title = 'Link check: URLs needing attention';
          const body = fs.readFileSync('link-report.md', 'utf8')
            + `\n\n---\nGenerated by [Link Check](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;

          const { data: open } = await github.rest.issues.listForRepo({
            owner: context.repo.owner, repo: context.repo.repo,
            state: 'open', creator: 'app/github-actions', per_page: 100,
          });
          const existing = open.find(i => i.title === title);

          if (process.env.HAS_ISSUES !== 'true') {
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: 'All links are resolving again. Closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
            }
            core.info('Nothing to report.');
            return;
          }

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: existing.number, body,
            });
            core.info(`Updated #${existing.number}`);
          } else {
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body,
            });
            core.info(`Opened #${created.number}`);
          }
